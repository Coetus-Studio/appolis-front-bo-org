<div>
  <h2>Eventos y Locaciones</h2>
</div>

<!-- Contenedor principal -->
<div style="display: flex; height: 100vh;">
  <!-- Barra lateral de búsqueda y lista de locaciones -->
  <div style="width: 300px; padding: 20px; overflow-y: auto; border-right: 1px solid #ccc;">
    <input
      type="text"
      class="w-full px-4 py-2 border border-gray-300 rounded-md mb-4"
      placeholder="Buscar locaciones..."
      (input)="filterLocations($event)"
    />

    <div *ngFor="let location of filteredLocations()" class="max-w-md text-gray-900 cursor-pointer" (click)="selectLocation(location)">
      <div class="flex flex-col pb-3">
        <dt class="mb-1 text-gray-500 text-lg md:text-lg">{{ location.address }}</dt>
        <dd class="text-lg font-semibold">{{ location.geo_point.coordinates }}</dd>
      </div>
    </div>
  </div>

  <!-- Mapa -->
  <div style="flex: 1;">
    <map-org style="height: 100%;"></map-org>
  </div>
</div>
<router-outlet></router-outlet>
