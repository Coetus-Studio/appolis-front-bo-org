<div class="flex space-x-4 h-[40rem]">
  <!-- Sidebar -->
  <div class="h-full">
    <div class="divide-y h-full overflow-auto pr-4">
      <!-- Loop through locations -->
      @for(location of $locations(); track location) {
      <div class="max-w-md text-gray-900" aria-hidden="true">
        <div class="flex flex-col pb-3">
          <dt class="mb-1 text-gray-500 text-lg md:text-lg">{{ location.address }}</dt>
          <!-- Optional: Add content here if needed -->
          <dd class="text-lg font-semibold">{{ location.description }}</dd>
        </div>
      </div>
      }
    </div>
  </div>

  <!-- Main Content -->
  <div class="w-4/5">
    <div class="w-full h-full">
      <!-- Add your content here -->

      <!-- google-maps-demo.component.html -->
       <google-map
        height="400px"
        width="750px"
        [zoom]="10"
        [center]="center()"/>
    </div>
  </div>
</div>
