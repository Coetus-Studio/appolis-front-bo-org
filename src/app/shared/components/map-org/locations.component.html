<div class="flex space-x-4 h-[40rem]">
  <!-- Sidebar -->
  <div class="h-full w-1/5">
    <div class="divide-y h-full overflow-auto pr-4">
      <h2 class="text-xl font-bold mb-4">Direcciones</h2>
      <!-- Barra de búsqueda -->
      <div class="mb-4">
        <input
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-md"
          placeholder="Buscar locaciones..."
          (input)="filterLocations($event)"
        />
      </div>

      <!-- Lista de locaciones filtradas -->
      <div *ngFor="let location of filteredLocations()" class="max-w-md text-gray-900" aria-hidden="true">
        <div class="flex flex-col pb-3 cursor-pointer" (click)="selectLocation(location)">
          <dt class="mb-1 text-gray-500 text-lg md:text-lg">{{ location.address }}</dt>
          <dd class="text-lg font-semibold">{{ location.geo_point.coordinates }}</dd>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="w-4/5">
    <div class="w-full h-full">
      <!-- Mapa de Google -->
      <google-map [center]="center()" [zoom]="zoom()" [options]="options" (mapClick)="moveMap($event)"
        (mapMousemove)="move($event)" style="height: 100%; width: 100%">
      </google-map>

      <!-- Información sobre el mapa -->
      <div style="position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 5px;">
<!--         <p>Center: {{ center().lat }}, {{ center().lng }}</p>
        <p>Zoom: {{ zoom() }}</p> -->
        <!-- <p *ngIf="display()">Mouse: {{ display()?.lat }}, {{ display()?.lng }}</p> -->
      </div>
    </div>
  </div>
</div>
