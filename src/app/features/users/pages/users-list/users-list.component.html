<div *ngIf="loading">
  Loading users...
</div>

<table mat-table [dataSource]="users" class="mat-elevation-z8" *ngIf="!loading">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let user"> {{user.name}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let user"> {{user.email}} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let user">
      <button mat-button color="primary" (click)="editUser(user._id)">Edit</button>
      <button mat-button color="warn" (click)="deactivateUser(user._id)">Deactivate</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['name', 'email', 'actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['name', 'email', 'actions'];"></tr>
</table>
