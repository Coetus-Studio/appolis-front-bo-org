<div *ngIf="loading">
  Loading user data...
</div>

<form *ngIf="!loading" [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" formControlName="name" placeholder="User's full name">
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" formControlName="email" placeholder="User's email">
  </div>

  <div class="mb-3">
    <label class="form-label">Roles by Organization</label>
    <div *ngIf="rolesFormArray.controls.length === 0">No roles assigned.</div>
    <ul *ngIf="rolesFormArray.controls.length > 0" class="list-group">
      <li *ngFor="let role of rolesFormArray.controls; let i = index" class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <strong>Organización:</strong> {{ role.get('organization')?.value?.name }}
          <br>
          <strong>Rol:</strong> {{ role.get('role')?.value }}
        </div>
        <!-- Remove button can be kept if needed for removing existing roles -->
        <!-- <button class="btn btn-danger btn-sm" (click)="removeRole(i)" type="button">
          Remove
        </button> -->
      </li>
    </ul>
  </div>

  <!-- The "Add Role" button is removed as roles are now read-only -->
  <!-- <button class="btn btn-secondary mb-3" (click)="addRole()" type="button">
    Add Role
  </button> -->

  <div class="d-flex justify-content-end">
    <button class="btn btn-primary me-2" type="submit" [disabled]="userForm.invalid">
      Guardar
    </button>

    <button class="btn btn-secondary" (click)="router.navigate(['/users'])" type="button">
      Cancelar
    </button>
  </div>

  <div class="mb-3">
    <a [routerLink]="['/users']">Volver al listado de Usuarios</a>
  </div>
</form>
