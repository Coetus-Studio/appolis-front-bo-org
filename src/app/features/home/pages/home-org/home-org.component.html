<main class="p-6">
  <div class="max-w-7xl mx-auto space-y-8">
    <header class="text-center">
      <h1 class="text-4xl font-bold text-gray-800">Bienvenido {{ navBarService.registeredOrgName() }}</h1>
      <p class="text-lg text-gray-600 mt-2">Empoderando a la comunidad para un futuro mejor</p>
    </header>

    <!-- Resumen dinámico -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <ng-container *ngIf="!isLoading; else loadingResumen">
        <div class="bg-white shadow rounded-2xl p-4 text-center">
          <h2 class="text-2xl font-semibold text-indigo-600">{{ totalEventsInProgress }}</h2>
          <p class="text-gray-600">Eventos en Curso</p>
        </div>
        <div class="bg-white shadow rounded-2xl p-4 text-center">
          <h2 class="text-2xl font-semibold text-yellow-500">{{ requirementsOrg }}</h2>
          <p class="text-gray-600">Requerimientos Ingresados</p>
        </div>
        <div class="bg-white shadow rounded-2xl p-4 text-center">
          <h2 class="text-2xl font-semibold text-green-600">{{ subscribedUser }}</h2>
          <p class="text-gray-600">Usuarios Suscritos</p>
        </div>
      </ng-container>

      <ng-template #loadingResumen>
        <div *ngFor="let i of [1,2,3]" class="bg-white shadow rounded-2xl p-4 text-center animate-pulse">
          <div class="h-8 w-16 bg-gray-300 mx-auto mb-2 rounded"></div>
          <div class="h-4 w-3/4 bg-gray-200 mx-auto rounded"></div>
        </div>
      </ng-template>
    </section>

  </div>
</main>
