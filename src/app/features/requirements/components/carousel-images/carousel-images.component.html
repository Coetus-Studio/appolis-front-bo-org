<div class="relative w-full overflow-hidden rounded-xl shadow-md">
  <div class="w-full h-64">
    <img
      [src]="images[currentIndex].url"
      alt="Imagen del requerimiento"
      class="w-full h-full object-cover transition duration-500"
    />
  </div>

  <!-- Controles -->
  <button (click)="prevSlide()" class="absolute top-1/2 left-4 -translate-y-1/2 bg-white p-2 rounded-full shadow">
    ‹
  </button>
  <button (click)="nextSlide()" class="absolute top-1/2 right-4 -translate-y-1/2 bg-white p-2 rounded-full shadow">
    ›
  </button>

  <!-- Dots -->
  <div class="flex justify-center mt-4 space-x-2">
    <span
      *ngFor="let image of images; let i = index"
      (click)="goToSlide(i)"
      [ngClass]="{
        'bg-blue-500': currentIndex === i,
        'bg-gray-300': currentIndex !== i
      }"
      class="w-3 h-3 rounded-full cursor-pointer block"
    ></span>
  </div>
</div>
