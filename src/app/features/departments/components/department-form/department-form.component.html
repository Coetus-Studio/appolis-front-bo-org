<form [formGroup]="departmentForm" (ngSubmit)="onSubmit()"
  class="max-w-xl mx-auto space-y-6 p-6 bg-white rounded-xl shadow-md">

  <!-- Nombre -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
    <input type="text" formControlName="name"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <div *ngIf="departmentForm.get('name')?.touched && departmentForm.get('name')?.invalid"
      class="text-sm text-red-600 mt-1">
      El nombre es requerido
    </div>
  </div>

  <!-- Descripción -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
    <textarea formControlName="description" rows="3"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    <div *ngIf="departmentForm.get('description')?.touched && departmentForm.get('description')?.invalid"
      class="text-sm text-red-600 mt-1">
      La descripción es requerida
    </div>
  </div>

  <!-- Categorías -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Categorías</label>

    <div class="border border-gray-300 rounded-lg p-3 max-h-48 overflow-y-auto space-y-2" formArrayName="categories">
      <div *ngFor="let option of categoryOptions; let i = index" class="flex items-center gap-2">
        <input type="checkbox" [formControlName]="i"
          class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
        <span class="text-sm text-gray-700">{{ option.label }}</span>
      </div>
    </div>

    <div *ngIf="categoriesFormArray.touched && !categoriesFormArray.value.includes(true)"
      class="text-sm text-red-600 mt-1">
      Debe seleccionar al menos una categoría
    </div>
  </div>


  <!-- Organización responsable -->
  <!-- <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Organización Responsable</label>
    <select formControlName="responsible_organization"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Selecciona una organización</option>
      <option value="6266003a7ff9f479325af047">Municipalidad X</option>
      <option value="otro_id_org">Otra organización</option>
    </select>
    <div
      *ngIf="departmentForm.get('responsible_organization')?.touched && departmentForm.get('responsible_organization')?.invalid"
      class="text-sm text-red-600 mt-1">
      La organización es requerida
    </div>
  </div> -->

  <!-- Sección Usuario -->
  <!-- Datos usuario asociado a Departamento -->
  <div class="pt-6 border-t border-gray-300">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Usuario</h2>

    <!-- Nombre del usuario -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
      <input formControlName="user_name" type="text"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input formControlName="user_email" type="email"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Teléfono -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
      <input formControlName="user_phone" type="tel"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- RUT -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">RUT</label>
      <input formControlName="user_rut" type="text" placeholder="12.345.678-9"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Contraseña -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
      <input formControlName="user_password" type="password"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
  </div>


  <!-- Botón Guardar -->
  <div class="text-center mt-6">
    <button type="submit"
      class="bg-blue-600 text-white font-semibold px-6 py-2 rounded hover:bg-blue-700 transition">
      {{ isUpdate ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>

</form>
