<div class="container">
  <h2 class="title">Listado de Eventos</h2>

  <div class="row">
    <!-- Listado de ubicaciones -->
    <div class="col-md-4 sidebar-list-event">
      <list-events  (eventClicked)="onEventClicked($event)"></list-events>
    </div>

    <!-- Mapa de ubicación -->
    <div class="col-md-8 map-container">
      <map-org (mapMouseMove)="moveMap($event)" #mapComponent></map-org>
    </div>
  </div>
</div>
