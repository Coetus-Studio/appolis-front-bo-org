<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Listar Eventos</h1>
    <button class="btn btn-primary" [routerLink]="['/events/create']">+ Crear Evento</button>
  </div>

  <!-- Barra de búsqueda -->
  <input
    type="text"
    class="form-control mb-3"
    placeholder="Buscar eventos..."
    (input)="searchEvents($event)">

  <!-- Lista de eventos -->
  <div *ngIf="filteredEvents.length > 0; else noEvents">
    <div *ngFor="let event of filteredEvents" class="card mb-4 shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">{{ event.title }}</h5>
      </div>

      <div class="card-body">
        <p class="card-text">{{ event.description }}</p>
        <p><strong>Fechas:</strong> {{ event.start_date }} - {{ event.end_date }}</p>
        <p><strong>Organización:</strong> {{ event.responsible_organization }}</p>

        <!-- Imagen del evento -->
        <!-- <div *ngIf="event.images?.length > 0" class="text-center mt-3">
          <img [src]="event.images[0]" alt="{{ event.title }}" class="img-fluid rounded" style="max-height: 200px;">
        </div> -->
      </div>
    </div>
  </div>

  <!-- Mensaje si no hay eventos -->
  <ng-template #noEvents>
    <div class="text-center mt-4">
      <p class="text-muted">No hay eventos disponibles.</p>
    </div>
  </ng-template>
</div>
